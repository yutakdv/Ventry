plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ventry'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Boot 4: starter-web → starter-webmvc 로 개편됨
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    // BE-02 캐시 — Caffeine CacheManager 연동(spring-context-support) + @EnableCaching
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // BE-02 DB 연동 (스펙 §3-1, expl §5 "탐색당 쿼리 1회")
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4: @WebMvcTest 슬라이스가 별도 스타터로 분리됨
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// plain jar 비활성화 — Dockerfile이 build/libs/*.jar 단일 파일을 복사한다
tasks.named('jar') {
    enabled = false
}
