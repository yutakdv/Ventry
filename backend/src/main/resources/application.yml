server:
  port: 8080
  # 종료 시 진행 중인 요청을 끊지 않는다 (BE 리뷰 N-08). 기본값은 즉시 종료라
  # `docker compose restart` 한 번이 응답 중이던 요청을 잘라 낸다.
  shutdown: graceful
  # BE-07: /api/recommend 는 실데이터에서 후보 1,061곳 · 769 KB 로 나온다(목 4곳 시절의 200배).
  # 슬라이더를 움직일 때마다 재호출되는 경로라 전송량이 곧 체감 반응성이다(스펙 §7 <100ms).
  # gzip 만으로 실측 769 → 125 KB (6.1배) 라, 계약·프론트를 건드리지 않고 해소된다.
  # 페이징은 계약 변경이라 D10 동결 전에는 하지 않는다 — 계약 §4 주석의 재검토 조건이다.
  #
  # text/event-stream 은 일부러 제외한다. SSE 는 「템플릿 문장 즉시 송출 → LLM refine 이
  # 선택적으로 교체」가 설계의 핵심인데(expl §2-5), 압축이 붙으면 이벤트가 버퍼에 모였다가
  # 한꺼번에 나갈 수 있다. 이벤트 하나가 수 KB 라 얻을 것도 없다.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 4KB

spring:
  application:
    name: ventry
  lifecycle:
    # graceful 만 켜면 **열린 SSE 스트림 때문에 종료가 최대 30초(기본값)까지 늘어난다** —
    # 탐색 스트림은 60초 타임아웃이라 정상 상태에서도 붙잡혀 있다. 개발·데모 중 재기동 체감이
    # 나빠지지 않게 상한을 함께 낮춘다 (BE 리뷰 N-08). 진행 중인 동기 요청은 밀리초 단위라
    # 5초면 충분하다.
    timeout-per-shutdown-phase: 5s
  jackson:
    # API 계약의 필드명은 snake_case — DTO record는 camelCase로 두고 직렬화에서 변환
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  # BE-02: compose가 DB_URL/DB_USER/DB_PASSWORD 환경변수를 주입한다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ventry}
    username: ${DB_USER:ventry}
    password: ${DB_PASSWORD:ventry-local}
    hikari:
      # QA 리뷰 2026-07-29 Q-03 — DB 가 내려간 상태에서 모든 엔드포인트가 **30초를 매달린 뒤**
      # 500 을 냈다(실측 30.02s ×2). 30초는 Hikari 기본 connection-timeout 이며, 그동안 톰캣
      # 워커가 요청 하나씩 붙잡고 있어 동시 접속 몇 건이면 워커가 고갈된다. 프론트에는 fetch
      # 타임아웃이 없어 목 폴백조차 30초 뒤에야 시작된다 — 「데모 무중단」이 30초 정지가 된다.
      #
      # 조회는 캐시 예열 후 밀리초 단위이고(실측 recommend 6~13ms) 풀도 기본 10 이라, 3초는
      # 정상 부하에서 닿지 않으면서 장애를 즉시 드러낸다. 빨리 실패해야 폴백이 빨리 뜬다.
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: -1   # 기동 시 DB 가 없어도 뜬다 — 살아난 뒤 스스로 복구한다

management:
  endpoints:
    web:
      exposure:
        include: health
