name: ai-ci

# PR 트리거에 paths 필터 없음 — 필수 상태 체크가 pending으로 병합을 막지 않게 항상 실행
# (frontend-ci.yml 상단 주석 참고)
on:
  push:
    branches: [ai]
    paths: ["ai/**", ".github/workflows/ai-ci.yml"]
  pull_request:
    branches: [develop]

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: ai-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint (ruff)
        working-directory: ai
        run: |
          pip install ruff
          ruff check .

      - name: Unit tests (pytest)
        working-directory: ai
        # 데이터 의존 통합 테스트는 data/ 부재 시 자동 skip — 순수 함수 산식만 게이트
        run: |
          pip install pytest pandas requests
          pytest tests -q

      - name: Docker build
        run: docker build -t ventry-batch ./ai
