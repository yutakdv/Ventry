# develop 통합 검증 + main 자동 병합 + 참조 이슈 종료
# - develop 대상 PR: compose 전체 빌드 + 기동 스모크 (병합 게이트)
# - develop push:   동일 검증 후 main으로 자동 병합 → PR이 참조한 이슈 종료

name: develop-ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: write

# PR 재푸시 시 이전 실행 취소. develop push(→ main 병합 포함)는 취소하지 않고 직렬화.
concurrency:
  group: develop-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose build
        run: docker compose build

      - name: Compose up
        run: docker compose up -d

      # `/api/health` 는 계약이 고정한 상수 응답이라 DB가 내려가 있어도 200 ok 를 준다.
      # 그것만 보면 **모든 업무 엔드포인트가 500인 스택도 CI를 통과한다**(QA 실측 Q-03-b).
      # 계약 엔드포인트의 생존은 그대로 확인하되, 게이트는 DB 인디케이터가 붙은 actuator 로 둔다.
      - name: Smoke — api health (계약 /api/health + DB 반영 /actuator/health)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health \
               && curl -fsS http://localhost:8080/actuator/health; then exit 0; fi
            sleep 3
          done
          echo "::error::api health check failed (계약 health 또는 actuator health)"
          curl -sS -o /dev/null -w 'api/health=%{http_code}\n'      http://localhost:8080/api/health      || true
          curl -sS -o /dev/null -w 'actuator/health=%{http_code}\n' http://localhost:8080/actuator/health || true
          docker compose logs api
          exit 1

      - name: Smoke — web 200
        run: curl -fsS -o /dev/null http://localhost:3000

      # 실데이터 계약 게이트 (G1~G9). 단위·통합 176건이 그린인 상태에서 P0 결함 7건이 살아
      # 있었던 이유는 그 테스트가 전부 픽스처 프로파일(!db)에서 돌았기 때문이다 — 변동금리
      # 13건·매출 결측·상권 1,000곳 이상·경계 91개를 한 번도 지나지 않았다.
      # 표준 라이브러리만 쓰므로 추가 설치가 없다.
      - name: Smoke — 실데이터 계약 게이트
        run: python3 scripts/qa_integration.py --contract-gate

      - name: Compose down
        if: always()
        run: docker compose down -v

  promote-to-main:
    name: auto-merge develop → main
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: compose-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge develop into main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --no-ff origin/develop -m "[CM] chore: auto-merge develop into main"
          git push origin main

  # 리포 default 브랜치가 main이라, develop 대상 PR 본문의 `Closes #N` 키워드로는
  # GitHub가 이슈를 자동 종료하지 않는다(default 브랜치 병합 시에만 발동).
  # 이때 GitHub는 closing 링크 자체를 만들지 않으므로(closingIssuesReferences 비어 있음)
  # PR 본문에서 키워드를 직접 파싱해, main 반영(promote-to-main)이 끝난 뒤 닫는다.
  close-referenced-issues:
    name: close referenced issues
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: promote-to-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Close issues referenced by the merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].number')
          if [ -z "$prs" ]; then
            echo "병합 커밋에 연결된 PR 없음 — 스킵"
            exit 0
          fi
          for pr in $prs; do
            # 키워드 미존재 시 grep 실패 → pipefail로 잡이 죽지 않도록 || true
            issues=$(gh pr view "$pr" --repo "$REPO" --json body --jq .body \
                       | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
                       | grep -oE '[0-9]+' | sort -n -u || true)
            if [ -z "$issues" ]; then
              echo "PR #$pr 본문에 closing 키워드 없음 — 스킵"
              continue
            fi
            for i in $issues; do
              # 이미 닫혔거나 이슈가 아닌 번호(PR 등)는 건너뛴다
              state=$(gh issue view "$i" --repo "$REPO" --json state --jq .state 2>/dev/null || echo MISSING)
              if [ "$state" != "OPEN" ]; then
                echo "#$i 상태=$state — 스킵"
                continue
              fi
              echo "closing #$i (PR #$pr → develop → main)"
              gh issue close "$i" --repo "$REPO" \
                --comment "PR #$pr 이 develop 병합 후 main까지 반영되어 자동 종료 (develop-ci)."
            done
          done
