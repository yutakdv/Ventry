name: frontend-ci

on:
  push:
    branches: [frontend]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: [develop]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

jobs:
  lint-build:
    name: frontend-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Docker build
        run: docker build -t ventry-web ./frontend
