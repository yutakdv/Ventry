name: frontend-ci

# PR 트리거에 paths 필터를 두지 않는 이유:
# develop 브랜치 보호의 필수 상태 체크(frontend-ci)로 등록되므로, 필터에 걸려 실행되지
# 않으면 체크가 영원히 pending → 병합 불가. develop 대상 PR에서는 항상 실행한다.
on:
  push:
    branches: [frontend]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    branches: [develop]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: frontend-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (lockfile 기준 재현 설치)
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Docker build
        run: docker build -t ventry-web ./frontend
