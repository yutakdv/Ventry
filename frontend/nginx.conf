server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 지금까지 무압축으로 나가고 있었다 — JS 번들도 경계 JSON도 원본 크기 그대로였다.
    # 경계 JSON 872KB → 약 202KB, 번들도 함께 줄어 첫 로드 체감에 직접 닿는다.
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # 기본 보안 헤더 (QA 리뷰 Q-10). 예선 스코프에서 실피해는 낮지만 제출물의 기본 하드닝
    # 항목이고 비용이 세 줄이다. CSP 는 넣지 않는다 — 카카오맵 SDK 가 외부 스크립트·이미지·
    # 인라인 스타일을 쓰므로 정확한 정책 없이 켜면 **지도가 조용히 죽는다**(심사 당일 최악의
    # 실패 모드). 켠다면 SDK 도메인을 실측해 허용 목록을 만든 뒤가 맞다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;   # `Server: nginx/1.27.5` 의 버전 노출 제거

    # `location /` 보다 **위에** 둔다. SPA 폴백(`$uri $uri/ /index.html`)이 파일 누락을
    # index.html 200 으로 감추면, fetch 는 성공한 뒤 JSON 파싱에서 터져 원인을 못 찾는다.
    # `=404` 로 없는 건 없다고 답하게 하고, 화면은 경계 없이 조용히 진행한다.
    # 정확 매칭이 아니라 프리픽스로 둔다 — 경로를 오타 냈을 때가 정확히 이 실패 모드다.
    location /geo/ {
        add_header Cache-Control "public, max-age=86400";
        # ⚠️ nginx 의 `add_header` 는 **상속이 아니라 교체**다 — 이 블록에 add_header 가 하나라도
        # 있으면 server 레벨 헤더가 통째로 사라진다. 그래서 여기서 다시 적는다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 해시가 박힌 빌드 산출물 — 내용이 바뀌면 파일명이 바뀌므로 영구 캐시가 안전하다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header 는 상속이 아니라 교체다 (위 /geo/ 와 같은 이유) — 보안 헤더를 다시 적는다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ⚠️ index.html 은 **절대 캐시하지 않는다.**
    #
    # 이 파일만이 「지금 어떤 번들을 쓰는가」를 가리킨다. 캐시되면 재빌드해도 브라우저가 옛
    # 해시를 계속 불러 **새 코드가 배포됐는데 화면은 그대로**가 된다. 실제로 이 증상을 겪었다
    # (실사용 점검 2026-07-30). 종전에는 Cache-Control 이 아예 없어 브라우저가 Last-Modified
    # 기반 휴리스틱으로 임의 캐싱했고, 그 시간이 얼마인지 우리가 통제할 수 없었다.
    #
    # 시연 중 재빌드가 반영되지 않는 것은 되돌릴 수 없는 종류의 사고라 확정적으로 막는다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA 라우팅 — try_files 의 내부 리다이렉트는 location 매칭을 다시 타므로
    # /index.html 로 떨어지는 모든 경로가 위 no-cache 블록을 거친다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → api 컨테이너 (SSE 지원: 버퍼링 끔)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
